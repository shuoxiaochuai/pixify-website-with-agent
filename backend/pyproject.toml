[project]
name = "ai-retouch-agent-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "arq",
    "redis",
    "boto3",
    "pillow",
    "python-multipart",
    "bcrypt",
    "pyjwt",
    "httpx",
    "boto3-stubs~=1.43.80",
]

[project.optional-dependencies]
cv = [
    "rembg",
    "onnxruntime",
    "opencv-python-headless",
    "rapidocr-onnxruntime",
]
agent = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    # Windows 本地没有系统 libpq，检查点驱动要自带二进制；Linux 服务器走系统 libpq
    "psycopg[binary]; sys_platform == 'win32'",
    "langchain-core",
    "langchain-openai",
]
lesion = [
    # 病灶分割推理。只在 Linux 部署机安装：本地开发不需要 2GB+ 的 CUDA 版 torch。
    # 无卡实例由 torch.cuda.is_available() 判定后直接提示算力不足，不影响启动。
    "torch>=2.4; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
# caunet.py / layers.py 逐字取自训练仓库，state_dict 键名就是类属性名，不能按风格改
exclude = ["migrations", "app/lesion/caunet.py", "app/lesion/layers.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# 数据库引擎在模块级创建，全部测试须共享同一事件循环，否则连接跨循环复用会失败
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
